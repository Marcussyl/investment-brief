<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投資簡報 | Marcus's Investment Brief</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <base href="/investment-brief/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stitch.css?v=20260901-10">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body data-theme="auto">
  
  <!-- Sticky Header -->
  <header class="header-glass">
    <div class="header-content">
      <h1 class="header-title">📊 投資簡報</h1>
      
      <!-- Desktop Navigation (inline with header) -->
      <nav class="desktop-nav desktop-only">
        <button class="desktop-nav-item active" data-view="today">今日重點</button>
        <button class="desktop-nav-item" data-view="market">市場動態</button>
        <button class="desktop-nav-item" data-view="portfolio">投資組合</button>
        <button class="desktop-nav-item" data-view="glossary">專業術語</button>
      </nav>
      
      <div class="header-actions">
        <button class="update-btn" id="updateBtn" aria-label="更新數據" title="更新">
          <svg class="update-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span class="update-label">更新</span>
        </button>
        <button class="theme-toggle" id="themeToggle" aria-label="切換主題">
          <svg class="theme-icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <div class="update-toast" id="updateToast" role="status" aria-live="polite" hidden></div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-container">
    
    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav mobile-only">
      <button class="nav-item active" data-view="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        </svg>
        <span>今日重點</span>
      </button>
      <button class="nav-item" data-view="market">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        <span>市場動態</span>
      </button>
      <button class="nav-item" data-view="portfolio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span>投資組合</span>
      </button>
      <button class="nav-item" data-view="glossary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>專業術語</span>
      </button>
    </nav>

    <!-- Feed + Desktop Sidebar Layout -->
    <div class="content-layout">
      
      <!-- Main Feed -->
      <main class="feed" id="mainFeed">
        
        <!-- View: Today (default) -->
        <div class="view active" id="viewToday">
          
          <div class="date-label">2026年8月31日</div>

          <!-- Disclaimer Card -->
          <div class="disclaimer-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <p><strong>非投資建議</strong> · 本簡報僅供參考，唔構成買賣建議。投資前請自行研究。</p>
          </div>

          <!-- Watchlist Chips -->
          <section class="section">
            <h2 class="section-title">觀察中</h2>
            <div class="chip-row" id="watchlistChips"></div>
          </section>

          <!-- Concept Chips -->
          <section class="section">
            <h2 class="section-title">熱門概念</h2>
            <div class="chip-row" id="conceptChips"></div>
          </section>

          <!-- Today's Highlights -->
          <section class="section">
            <h2 class="section-title">⭐ 今日重點</h2>
            <div class="highlights-card">
              <ul class="highlights-list">
                <li>SHEIN 625 9月1日上市</li>
                <li>美國 8 月非農 9月4日 20:30 HKT</li>
                <li>FOMC 會議 9月15-16日</li>
              </ul>
            </div>
          </section>

          <!-- Story Cards -->
          <section class="section">
            <h2 class="section-title">今日簡報</h2>
            <div class="story-grid" id="storyGrid"></div>
          </section>

        </div>

        <!-- View: Market -->
        <div class="view" id="viewMarket">
          <div class="date-label">市場動態</div>

          <!-- Tech News Disclaimer -->
          <div class="disclaimer-card" id="techNewsDisclaimer" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <p id="techNewsDisclaimerText"></p>
          </div>

          <!-- Tech News Digest -->
          <section class="section" id="techNewsSection">
            <h2 class="section-title">📰 科技新聞摘要</h2>
            <div class="tech-news-list" id="techNewsList"></div>
          </section>

          <!-- Market Charts -->
          <section class="section">
            <h2 class="section-title">觀察名單走勢</h2>
            <div class="charts-grid" id="marketCharts"></div>
          </section>
        </div>

        <!-- View: Portfolio -->
        <div class="view" id="viewPortfolio">
          <div class="date-label">投資組合</div>
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <h3>未標持倉</h3>
            <p>在名稱抽屜中標記持倉後，這裡會顯示你的投資組合。</p>
          </div>
        </div>

        <!-- View: Glossary -->
        <div class="view" id="viewGlossary">
          <div class="date-label">專業術語</div>
          <section class="section">
            <h2 class="section-title">投資詞彙表</h2>
            <div class="glossary-grid" id="glossaryGrid"></div>
          </section>
        </div>

      </main>

      <!-- Desktop Right Panel -->
      <aside class="right-panel desktop-only" id="rightPanel">
        <div class="panel-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <p>點擊名稱或故事查看詳情</p>
        </div>
      </aside>

    </div>

  </div>

  <!-- Bottom Sheet Overlay -->
  <div class="sheet-scrim" id="sheetScrim"></div>
  
  <!-- Bottom Sheet Container -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-topbar">
      <button class="sheet-close" id="sheetClose" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="sheet-content" id="sheetContent"></div>
  </div>

  <script src="stitch-app.js?v=20260901-10"></script>
</body>
</html>
